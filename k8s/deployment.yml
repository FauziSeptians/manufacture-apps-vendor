apiVersion: apps/v1
kind: Deployment
metadata:
  name: manufacture-apps-vendor
  labels:
    app: manufacture-apps-vendor
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: manufacture-apps-vendor
  template:
    metadata:
      labels:
        app: manufacture-apps-vendor
    spec:
      containers:
        - name: manufacture-apps-vendor
          image: muhammadfauzi/manufacture-apps-vendor:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_OPTIONS
              value: '--max-old-space-size=384'
            - name: NODE_ENV
              value: 'production'
          envFrom:
            - secretRef:
                name: manufacture-app-secrets
          resources:
            requests:
              memory: '256Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: manufacture-apps-vendor-service
  labels:
    app: manufacture-apps-vendor
spec:
  type: NodePort
  selector:
    app: manufacture-apps-vendor
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30900
